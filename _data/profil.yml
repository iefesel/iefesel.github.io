hakkimda: |
  Orta Doğu Teknik Üniversitesi'nde fizik lisans öğrencisiyim. Temel fizik kuramlarını ve laboratuvar uygulamalarını kapsayan bir eğitim alıyorum.

  Kariyerimi parçacık fiziği, yüksek enerji fiziği ve hızlandırıcı teknolojileri alanlarında araştırma yaparak şekillendirmek istiyorum. Matematiğe ve kuantum mekaniğine olan ilgim, bu alanlar için gereken analitik düşünme ve problem çözme becerilerimi geliştirmemde bana yol gösteriyor.

  Bu site, öğrendiklerimi ve üzerinde çalıştıklarımı not ettiğim yer.

