  I am an undergraduate physics student at Middle East Technical University (METU), receiving a comprehensive education in fundamental physical theories and their laboratory applications.

  I aim to build a research career in particle physics, high energy physics and accelerator technologies. A particular interest in mathematics and quantum mechanics drives me to develop the analytical and problem-solving skills these fields demand.

  This site is where I keep notes on what I learn and what I work on.

