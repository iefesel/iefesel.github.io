---
layout: default
title: İletişim
bolum: iletisim
---
{%- assign p = site.data.profil -%}
<p class="eyebrow">İletişim</p>
<h1 class="h">Bana ulaş</h1>
<div class="prose"><p>{{ p.iletisim_metni }}</p></div>
<div class="contact">
{%- for c in p.iletisim %}
  <div class="item">
    <span class="label">{{ c.ad }}</span>
    <span class="value">{% if c.url %}<a href="{{ c.url }}" target="_blank" rel="noopener">{{ c.deger }}</a>{% else %}{{ c.deger }}{% endif %}</span>
    {% if c.kopyala %}<button class="btn copy" type="button" data-v="{{ c.deger }}">Kopyala</button>{% else %}<span></span>{% endif %}
  </div>
{%- endfor %}
</div>
