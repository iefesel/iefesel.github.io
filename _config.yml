# Site settings — you rarely need to touch this file.
title: İbrahim Efe Sel
description: Physics undergraduate at METU. Notes, writing and documents on mathematical physics, particle physics and accelerator technologies.
url: https://iefesel.github.io
baseurl: ""
lang: en

# Blog post addresses look like: iefesel.github.io/blog/post-name/
permalink: /blog/:title/

markdown: kramdown
kramdown:
  input: GFM

timezone: Europe/Istanbul

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# Every post uses the "post" layout automatically
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
