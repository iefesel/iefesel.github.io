<style>
/* Layout: sabit sol kimlik sütunu (fotoğraf, isim, linkler) + sağda sekmeli içerik; telefonda kompakt başlık + tek sütun. */
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --fg: #1b1f27;
  --muted: #5d6573;
  --line: #e1e4ea;
  --accent: #1f5c85;
  --accent-soft: #e6eef5;
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151a; --surface: #191d24; --fg: #e7e9ee; --muted: #9aa3b2;
    --line: #2a303a; --accent: #7fb6dc; --accent-soft: #1d2b38; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151a; --surface: #191d24; --fg: #e7e9ee; --muted: #9aa3b2;
  --line: #2a303a; --accent: #7fb6dc; --accent-soft: #1d2b38; color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.65;
  margin: 0; padding-inline: 20px; padding-block: 0;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 6px 12px; border: 1px solid var(--line); border-radius: var(--radius); z-index: 10; }
.skip:focus { left: 16px; }

.shell {
  max-width: 1040px; margin: 0 auto;
  display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 72px;
  padding-block: 72px 48px;
}

/* --- Sol sütun --- */
.id { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; display: grid; gap: 22px; }
.avatar {
  width: 112px; height: 112px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; overflow: hidden;
  font-family: var(--font-display); font-size: 40px; line-height: 1;
  border: 1px solid var(--line);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.name { font-family: var(--font-display); font-weight: 400; font-size: 44px; line-height: 1.02; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.tagline { margin: -10px 0 0; color: var(--muted); font-size: 15px; }
.meta { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-mono); font-size: 13px; }
.links a { text-decoration: none; }
.links a:hover { text-decoration: underline; }

/* --- Gezinme --- */
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px 26px; border-bottom: 1px solid var(--line); margin-bottom: 40px; scroll-margin-top: 12px; }
nav.tabs a {
  color: var(--muted); text-decoration: none; padding-block: 10px; margin-bottom: -1px;
  font-size: 15px; font-weight: 500; border-bottom: 2px solid transparent;
}
nav.tabs a:hover { color: var(--fg); }
nav.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }

main { min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.15; margin: 0 0 18px; text-wrap: balance; }
h3 { font-size: 17px; font-weight: 600; margin: 0; line-height: 1.4; }
.prose { max-width: 64ch; }
.prose p { margin: 0 0 1.1em; }
.prose h3 { margin: 1.8em 0 0.5em; }
.prose ul { padding-left: 1.2em; margin: 0 0 1.1em; }
.prose li { margin-bottom: 0.35em; }
.prose blockquote { margin: 1.4em 0; padding-left: 18px; border-left: 2px solid var(--line); color: var(--muted); font-style: italic; }

/* --- Özgeçmiş blokları --- */
.cv { display: grid; gap: 40px; margin-top: 48px; max-width: 68ch; }
.cv-block h3.cv-title { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.cv-row { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 20px; padding-block: 12px; }
.cv-row + .cv-row { border-top: 1px dashed var(--line); }
.cv-when { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.cv-what { font-weight: 500; }
.cv-note { color: var(--muted); font-size: 15px; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px; margin: 0; list-style: none; padding-left: 0; }
.chip { font-size: 14.5px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; }
.section-sub { margin-top: 56px; }

/* --- Blog listesi --- */
.posts { list-style: none; padding: 0; margin: 0; max-width: 68ch; }
.posts li { border-top: 1px solid var(--line); }
.posts li:last-child { border-bottom: 1px solid var(--line); }
.posts a.row {
  display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 20px;
  padding-block: 20px; color: inherit; text-decoration: none;
}
.posts a.row:hover h3 { color: var(--accent); }
.date { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; }
.posts p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
.empty { color: var(--muted); max-width: 64ch; }

/* --- Tek yazı --- */
.back { font-family: var(--font-mono); font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 28px; }
.post-head { margin-bottom: 28px; max-width: 64ch; }
.post-head h2 { font-size: 40px; margin-bottom: 10px; }
.post-head .date { padding: 0; }
.post-nav { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; max-width: 64ch; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 15px; }

/* --- Projeler --- */
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.project {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 22px; display: grid; grid-template-rows: auto 1fr auto; gap: 8px; min-width: 0;
}
.project .year { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.project p { margin: 0; color: var(--muted); font-size: 15px; }
.project .foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
.status { font-family: var(--font-mono); font-size: 11.5px; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

/* --- İletişim --- */
.contact { display: grid; max-width: 560px; margin-top: 8px; }
.contact .item { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding-block: 14px; border-top: 1px solid var(--line); }
.contact .item:last-child { border-bottom: 1px solid var(--line); }
.contact .label { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.contact .value { overflow-wrap: anywhere; }
.btn {
  font: 500 12.5px var(--font-mono); color: var(--accent); background: transparent;
  border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 10px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }

footer { max-width: 1040px; margin: 0 auto; padding-block: 28px 40px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
footer .right { display: flex; align-items: center; gap: 14px; }

.fade { animation: fade .35s ease both; }
@keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 32px; padding-block: 32px 32px; }
  .id { position: static; grid-template-columns: 76px minmax(0, 1fr); column-gap: 16px; row-gap: 12px; align-items: center; }
  .avatar { width: 76px; height: 76px; grid-row: 1 / 3; font-size: 30px; }
  .name { font-size: 32px; align-self: end; }
  .tagline { margin: 0; align-self: start; grid-column: 2; font-size: 14.5px; line-height: 1.5; }
  .meta, .links { grid-column: 1 / -1; }
  .meta { display: flex; flex-wrap: wrap; gap: 2px 14px; }
  nav.tabs { margin-bottom: 28px; }
}
@media (max-width: 520px) {
  nav.tabs { gap: 4px 20px; }
  .posts a.row, .cv-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .contact .item { grid-template-columns: minmax(0, 1fr) auto; row-gap: 2px; }
  .contact .label { grid-column: 1 / -1; }
  .post-head h2 { font-size: 32px; }
  h2 { font-size: 30px; }
}
</style>

/* ===================================================================== */

const AYLAR = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const fmtDate = iso => { const [y,m,d] = iso.split("-").map(Number); return `${d} ${AYLAR[m-1]} ${y}`; };
const readTime = html => Math.max(1, Math.round(html.replace(/<[^>]+>/g," ").trim().split(/\s+/).length / 200));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ext = url => `href="${esc(url)}" target="_blank" rel="noopener"`;
const live = arr => arr.filter(x => !x.taslak);
const POSTS = live(SITE.posts).sort((a,b) => b.date.localeCompare(a.date));
const PROJECTS = live(SITE.projects);

function renderId() {
  const av = SITE.photo
    ? `<img src="${esc(SITE.photo)}" alt="${esc(SITE.name)}" width="112" height="112">`
    : `<span aria-hidden="true">${esc(SITE.initials)}</span>`;
  document.getElementById("id").innerHTML = `
    <div class="avatar">${av}</div>
    <h1 class="name">${esc(SITE.name)}</h1>
    <p class="tagline">${esc(SITE.tagline)}</p>
    <ul class="meta">${SITE.meta.map(m => `<li>${esc(m)}</li>`).join("")}</ul>
    <div class="links">${SITE.links.map(l => `<a ${ext(l.url)}>${esc(l.label)} ↗</a>`).join("")}</div>`;
  document.getElementById("foot-left").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;
  document.getElementById("foot-domain").textContent = SITE.domain;
}

function postList(items) {
  if (!items.length) return `<p class="empty">Henüz yazı yok. İlk yazı yakında burada olacak.</p>`;
  return `<ul class="posts">${items.map(p => `
    <li><a class="row" href="#${esc(p.slug)}">
      <span class="date">${fmtDate(p.date)}</span>
      <div><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p>
        <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>
    </a></li>`).join("")}</ul>`;
}

function cvBlock(b) {
  const body = b.chips
    ? `<ul class="chips">${b.chips.map(c => `<li class="chip">${esc(c)}</li>`).join("")}</ul>`
    : b.rows.map(r => `
      <div class="cv-row">
        <span class="cv-when">${esc(r.when)}</span>
        <div><div class="cv-what">${esc(r.what)}</div>${r.note ? `<div class="cv-note">${esc(r.note)}</div>` : ""}</div>
      </div>`).join("");
  return `<div class="cv-block"><h3 class="cv-title">${esc(b.title)}</h3>${body}</div>`;
}

function renderStatic() {
  document.getElementById("view-hakkimda").innerHTML = `
    <p class="eyebrow">Hakkımda</p>
    <h2>Merhaba, ben ${esc(SITE.shortName)}.</h2>
    <div class="prose">${SITE.about}</div>
    <div class="cv">${SITE.cv.map(cvBlock).join("")}</div>
    ${POSTS.length ? `<div class="section-sub">
      <p class="eyebrow">Son yazılar</p>
      ${postList(POSTS.slice(0, 3))}
      ${POSTS.length > 3 ? `<p><a href="#blog">Tüm yazılar →</a></p>` : ""}
    </div>` : ""}`;

  document.getElementById("view-blog").innerHTML = `
    <p class="eyebrow">Blog · ${POSTS.length} yazı</p>
    <h2>Yazılar</h2>
    ${postList(POSTS)}`;

  document.getElementById("view-projeler").innerHTML = `
    <p class="eyebrow">Projeler</p>
    <h2>Üzerinde çalıştıklarım</h2>
    ${PROJECTS.length ? `<div class="projects">${PROJECTS.map(p => `
      <article class="project">
        <span class="year">${esc(p.year)}</span>
        <div><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p></div>
        <div class="foot"><span class="status">${esc(p.status)}</span>
          ${p.url ? `<a ${ext(p.url)}>Görüntüle ↗</a>` : ""}</div>
      </article>`).join("")}</div>` : `<p class="empty">Projeler yakında eklenecek.</p>`}`;

  document.getElementById("view-iletisim").innerHTML = `
    <p class="eyebrow">İletişim</p>
    <h2>Bana ulaş</h2>
    <div class="prose"><p>Bir soru, öneri ya da iş birliği için yazabilirsin.</p></div>
    <div class="contact">${SITE.contact.map((c, i) => `
      <div class="item">
        <span class="label">${esc(c.label)}</span>
        <span class="value">${c.url ? `<a ${ext(c.url)}>${esc(c.value)}</a>` : esc(c.value)}</span>
        ${c.copy ? `<button class="btn copy" type="button" id="copy-${i}" data-v="${esc(c.value)}">Kopyala</button>` : "<span></span>"}
      </div>`).join("")}</div>`;
}

function renderPost(p) {
  const i = POSTS.indexOf(p), newer = POSTS[i - 1], older = POSTS[i + 1];
  document.getElementById("view-yazi").innerHTML = `
    <a class="back" href="#blog">← Tüm yazılar</a>
    <header class="post-head">
      <h2>${esc(p.title)}</h2>
      <span class="date">${fmtDate(p.date)} · ${readTime(p.body)} dk okuma</span>
      <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    </header>
    <article class="prose">${p.body}</article>
    ${newer || older ? `<nav class="post-nav" aria-label="Diğer yazılar">
      <span>${older ? `<a href="#${esc(older.slug)}">← ${esc(older.title)}</a>` : ""}</span>
      <span>${newer ? `<a href="#${esc(newer.slug)}">${esc(newer.title)} →</a>` : ""}</span>
    </nav>` : ""}`;
}

function route() {
  const key = decodeURIComponent(location.hash.slice(1)) || "hakkimda";
  const post = POSTS.find(p => p.slug === key);
  const view = post ? "yazi" : (["hakkimda","blog","projeler","iletisim"].includes(key) ? key : "hakkimda");
  if (post) { renderPost(post); document.title = `${post.title} · ${SITE.name}`; }
  else document.title = SITE.name;
  document.querySelectorAll("[data-view]").forEach(s => {
    const on = s.dataset.view === view;
    s.hidden = !on;
    if (on) { s.classList.remove("fade"); void s.offsetWidth; s.classList.add("fade"); }
  });
  const activeTab = post ? "blog" : view;
  document.querySelectorAll("nav.tabs a").forEach(a =>
    a.dataset.tab === activeTab ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}

/* Sekme değişince: masaüstünde sayfanın başına, telefonda sekmelerin başına kaydır */
function scrollAfterRoute() {
  const nav = document.getElementById("tabs");
  const stacked = matchMedia("(max-width: 820px)").matches;
  if (stacked) { if (nav.getBoundingClientRect().top < 0) nav.scrollIntoView(); }
  else window.scrollTo({ top: 0 });
}

/* Kopyala düğmesi */
document.addEventListener("click", e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const v = b.dataset.v;
  const done = () => { b.textContent = "Kopyalandı"; setTimeout(() => b.textContent = "Kopyala", 1600); };
  try { navigator.clipboard.writeText(v).then(done, () => selectText(b)); } catch (err) { selectText(b); }
});
function selectText(b) {
  const el = b.parentElement.querySelector(".value");
  const r = document.createRange(); r.selectNodeContents(el);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

/* Tema düğmesi: Sistem → Açık → Koyu */
const THEMES = [["", "Sistem"], ["light", "Açık"], ["dark", "Koyu"]];
const themeBtn = document.getElementById("theme-btn");
function currentTheme() { return document.documentElement.getAttribute("data-theme") || ""; }
function paintThemeBtn() { themeBtn.textContent = "Tema: " + (THEMES.find(t => t[0] === currentTheme()) || THEMES[0])[1]; }
themeBtn.addEventListener("click", () => {
  const i = THEMES.findIndex(t => t[0] === currentTheme());
  const next = THEMES[(i + 1) % THEMES.length][0];
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try { next ? localStorage.setItem("tema", next) : localStorage.removeItem("tema"); } catch (err) {}
  paintThemeBtn();
});

renderId(); renderStatic(); route(); paintThemeBtn();
addEventListener("hashchange", () => { route(); scrollAfterRoute(); });
</script>
