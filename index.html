<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Efe Sel</title>
<meta name="description" content="Efe Sel — kişisel site: hakkımda, blog yazıları, projeler ve iletişim.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sabit sol kimlik sütunu (isim, kısa tanım, linkler) + sağda sekmeli içerik; telefonda tek sütun. */
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --fg: #1b1f27;
  --muted: #5d6573;
  --line: #e1e4ea;
  --accent: #1f5c85;
  --accent-soft: #e6eef5;
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151a; --surface: #191d24; --fg: #e7e9ee; --muted: #9aa3b2;
    --line: #2a303a; --accent: #7fb6dc; --accent-soft: #1d2b38; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151a; --surface: #191d24; --fg: #e7e9ee; --muted: #9aa3b2;
  --line: #2a303a; --accent: #7fb6dc; --accent-soft: #1d2b38; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.65;
  margin: 0; padding-inline: 20px; padding-block: 0;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }

.shell {
  max-width: 1040px; margin: 0 auto;
  display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 72px;
  padding-block: 72px 48px;
}

/* --- Sol sütun --- */
.id { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; display: grid; gap: 22px; }
.avatar {
  width: 96px; height: 96px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; overflow: hidden;
  font-family: var(--font-display); font-size: 40px; line-height: 1;
  border: 1px solid var(--line);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.name { font-family: var(--font-display); font-weight: 400; font-size: 44px; line-height: 1.02; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.tagline { margin: -10px 0 0; color: var(--muted); font-size: 15px; }
.meta { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-mono); font-size: 13px; }
.links a { text-decoration: none; }
.links a:hover { text-decoration: underline; }

/* --- Gezinme --- */
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px 26px; border-bottom: 1px solid var(--line); margin-bottom: 40px; }
nav.tabs a {
  color: var(--muted); text-decoration: none; padding-block: 10px; margin-bottom: -1px;
  font-size: 15px; font-weight: 500; border-bottom: 2px solid transparent;
}
nav.tabs a:hover { color: var(--fg); }
nav.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }

main { min-width: 0; }
section[hidden] { display: none; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.15; margin: 0 0 18px; text-wrap: balance; }
h3 { font-size: 17px; font-weight: 600; margin: 0; line-height: 1.4; }
.prose { max-width: 64ch; }
.prose p { margin: 0 0 1.1em; }
.prose h3 { margin: 1.8em 0 0.5em; }
.prose ul { padding-left: 1.2em; margin: 0 0 1.1em; }
.prose li { margin-bottom: 0.35em; }
.prose blockquote { margin: 1.4em 0; padding-left: 18px; border-left: 2px solid var(--line); color: var(--muted); font-style: italic; }

/* --- Hakkımda --- */
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 10px 28px; margin: 32px 0 0; max-width: 64ch; }
.facts dt { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); padding-top: 2px; }
.facts dd { margin: 0; }
.section-sub { margin-top: 56px; }

/* --- Blog listesi --- */
.posts { list-style: none; padding: 0; margin: 0; max-width: 68ch; }
.posts li { border-top: 1px solid var(--line); }
.posts li:last-child { border-bottom: 1px solid var(--line); }
.posts a.row {
  display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 20px;
  padding-block: 20px; color: inherit; text-decoration: none;
}
.posts a.row:hover h3 { color: var(--accent); }
.date { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; }
.posts p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }

/* --- Tek yazı --- */
.back { font-family: var(--font-mono); font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 28px; }
.post-head { margin-bottom: 28px; max-width: 64ch; }
.post-head h2 { font-size: 40px; margin-bottom: 10px; }
.post-head .date { padding: 0; }

/* --- Projeler --- */
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.project {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 22px; display: grid; grid-template-rows: auto 1fr auto; gap: 8px; min-width: 0;
}
.project .year { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.project p { margin: 0; color: var(--muted); font-size: 15px; }
.project .foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
.status { font-family: var(--font-mono); font-size: 11.5px; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

/* --- İletişim --- */
.contact { display: grid; gap: 0; max-width: 560px; margin-top: 8px; }
.contact .item { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding-block: 14px; border-top: 1px solid var(--line); }
.contact .item:last-child { border-bottom: 1px solid var(--line); }
.contact .label { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.contact .value { overflow-wrap: anywhere; user-select: all; }
.copy {
  font: 500 12.5px var(--font-mono); color: var(--accent); background: transparent;
  border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 10px; cursor: pointer;
}
.copy:hover { border-color: var(--accent); }

footer { max-width: 1040px; margin: 0 auto; padding-block: 28px 40px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.fade { animation: fade .35s ease both; }
@keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 40px; padding-block: 40px 32px; }
  .id { position: static; }
  .name { font-size: 40px; }
}
@media (max-width: 520px) {
  .posts a.row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .contact .item { grid-template-columns: minmax(0, 1fr) auto; }
  .contact .label { grid-column: 1 / -1; }
  .facts { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .facts dd { margin-bottom: 12px; }
  .post-head h2 { font-size: 32px; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="id" id="id"></aside>
  <main>
    <nav class="tabs" aria-label="Bölümler">
      <a href="#hakkimda" data-tab="hakkimda">Hakkımda</a>
      <a href="#blog" data-tab="blog">Blog</a>
      <a href="#projeler" data-tab="projeler">Projeler</a>
      <a href="#iletisim" data-tab="iletisim">İletişim</a>
    </nav>
    <section id="view-hakkimda" data-view="hakkimda"></section>
    <section id="view-blog" data-view="blog" hidden></section>
    <section id="view-yazi" data-view="yazi" hidden></section>
    <section id="view-projeler" data-view="projeler" hidden></section>
    <section id="view-iletisim" data-view="iletisim" hidden></section>
  </main>
</div>
<footer>
  <span id="foot-left"></span>
  <span>iefesel.com</span>
</footer>

<script>
/* =====================================================================
   SİTE İÇERİĞİ — Sadece bu bölümü düzenlemen yeterli.
   Metinler örnektir; kendi bilgilerinle değiştir.
   ===================================================================== */
const SITE = {
  name: "Efe Sel",
  initials: "ES",
  photo: "",                       // Örn: "foto.jpg" — boş kalırsa baş harfler görünür
  tagline: "Öğrenci. Öğrendiklerimi buraya not ediyorum.",
  meta: ["İstanbul, Türkiye", "Öğrenci · Okul / Bölüm adı"],
  links: [
    { label: "GitHub",    url: "https://github.com/iefesel" },
    { label: "LinkedIn",  url: "https://www.linkedin.com/in/ibrahim-efe-sel-292746395" },
    { label: "X",         url: "https://x.com/iefesel" }
  ],

  about: `
    <p>Şu an öğrenciyim ve boş zamanlarımın çoğunu yeni bir şeyler öğrenmeye, denemeye ve bazen de bozup yeniden yapmaya harcıyorum.</p>
    <p>Bu site benim dijital defterim. Okuduğum, izlediğim, üzerinde çalıştığım şeyleri yazıya döküyorum. Bir konuyu başkasına anlatabilecek kadar yazmak, onu gerçekten anlayıp anlamadığımı görmenin en iyi yolu.</p>
    <p>Burada ders notlarından küçük projelere, kitap önerilerinden günlük düşüncelere kadar her şeyi bulabilirsin.</p>`,
  facts: [
    ["Okul",          "Okul adı — Bölüm, sınıf"],
    ["İlgi alanları", "Teknoloji, yazılım, kitaplar, fotoğrafçılık"],
    ["Şu an",         "Yeni dönemin derslerine ve bu siteye odaklanıyorum"],
    ["Diller",        "Türkçe (ana dil), İngilizce"]
  ],

  // Yeni yazı eklemek için bu listeye bir öğe ekle. slug: sadece küçük harf, rakam ve tire.
  posts: [
    {
      slug: "ilk-web-sitem",
      title: "İlk kişisel web sitemi kurdum",
      date: "2026-10-01",
      tags: ["web", "günlük"],
      summary: "Neden kendi adıma bir site açtım ve onu nasıl kurdum.",
      body: `
        <p>Uzun süredir kendime ait, sosyal medyadan bağımsız bir köşem olsun istiyordum. Bugün sonunda <strong>iefesel.com</strong> yayında.</p>
        <h3>Neden bir site?</h3>
        <p>Sosyal medyada paylaşılan her şey birkaç gün içinde akışta kayboluyor. Bir sitede ise yazdıklarım düzenli kalıyor, istediğim zaman geri dönüp bakabiliyorum ve birine “şuna bak” diye tek bir link gönderebiliyorum.</p>
        <h3>Planım</h3>
        <ul>
          <li>Ayda en az iki yazı yazmak</li>
          <li>Üzerinde çalıştığım projeleri burada toplamak</li>
          <li>Siteyi zamanla kendim geliştirmek</li>
        </ul>
        <p>Okuduğun için teşekkürler. Bir sonraki yazıda görüşmek üzere.</p>`
    },
    {
      slug: "calisma-duzenim",
      title: "Sınav dönemi için çalışma düzenim",
      date: "2026-09-18",
      tags: ["okul", "verimlilik"],
      summary: "Pomodoro, aralıklı tekrar ve telefonu başka odaya koymak üzerine.",
      body: `
        <p>Geçen dönem en çok zorlandığım şey çalışmaya oturmak değil, oturduktan sonra odağımı korumaktı. Bu dönem birkaç basit kuralla başlıyorum.</p>
        <h3>1. 25 dakika çalış, 5 dakika ara</h3>
        <p>Pomodoro tekniği kulağa basit geliyor ama asıl faydası başlamayı kolaylaştırması. “Sadece 25 dakika” demek, “bütün akşam çalışacağım” demekten çok daha az korkutucu.</p>
        <h3>2. Aralıklı tekrar</h3>
        <p>Bir konuyu öğrendiğim gün, üç gün sonra ve bir hafta sonra kısaca tekrar ediyorum. Sınavdan önceki gece her şeyi baştan okumak yerine bu çok daha kalıcı oluyor.</p>
        <h3>3. Telefon başka odada</h3>
        <blockquote>Telefon masadayken bakmıyor olsam bile aklımın bir köşesi onda.</blockquote>
        <p>Bu üçünü bir ay deneyip sonuçlarını burada paylaşacağım.</p>`
    },
    {
      slug: "bu-yaz-okuduklarim",
      title: "Bu yaz okuduğum üç kitap",
      date: "2026-08-30",
      tags: ["kitap"],
      summary: "Yaz tatilinde okuduklarım ve her birinden aklımda kalan tek fikir.",
      body: `
        <p>Bu yaz kendime “her hafta en az 50 sayfa” hedefi koydum. Hedefi her hafta tutturamasam da üç kitabı bitirdim.</p>
        <p>Her kitap için uzun bir özet yerine, aklımda kalan tek bir fikri yazmayı tercih ediyorum. Böylece hem kısa oluyor hem de gerçekten neyi hatırladığımı görüyorum.</p>
        <ul>
          <li><strong>Kitap 1</strong> — aklımda kalan fikir</li>
          <li><strong>Kitap 2</strong> — aklımda kalan fikir</li>
          <li><strong>Kitap 3</strong> — aklımda kalan fikir</li>
        </ul>
        <p>Önerin varsa iletişim sayfasından yazabilirsin.</p>`
    }
  ],

  projects: [
    { title: "iefesel.com", year: "2026", status: "Yayında",
      desc: "Şu an baktığın site. Hakkımda, blog, projeler ve iletişim bölümlerinden oluşan kişisel web sitem.",
      url: "https://iefesel.com" },
    { title: "Ders notları arşivi", year: "2026", status: "Devam ediyor",
      desc: "Derslerde aldığım notları düzenli ve aranabilir bir hale getirdiğim kişisel arşiv.", url: "" },
    { title: "Proje adı", year: "2025", status: "Tamamlandı",
      desc: "Burada yaptığın bir okul ödevini, kulüp çalışmasını ya da hobi projeni kısaca anlat.", url: "" }
  ],

  contact: [
    { label: "E-posta",   value: "merhaba@iefesel.com", copy: true },
    { label: "LinkedIn",  value: "linkedin.com/in/ibrahim-efe-sel-292746395", url: "https://www.linkedin.com/in/ibrahim-efe-sel-292746395" },
    { label: "GitHub",    value: "github.com/iefesel", url: "https://github.com/iefesel" }
  ]
};
/* ===================================================================== */

const AYLAR = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const fmtDate = iso => { const [y,m,d] = iso.split("-").map(Number); return `${d} ${AYLAR[m-1]} ${y}`; };
const readTime = html => Math.max(1, Math.round(html.replace(/<[^>]+>/g," ").trim().split(/\s+/).length / 200));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ext = url => `href="${esc(url)}" target="_blank" rel="noopener"`;
const postsSorted = [...SITE.posts].sort((a,b) => b.date.localeCompare(a.date));

function renderId() {
  const av = SITE.photo ? `<img src="${esc(SITE.photo)}" alt="${esc(SITE.name)}">` : esc(SITE.initials);
  document.getElementById("id").innerHTML = `
    <div class="avatar" aria-hidden="${SITE.photo ? "false" : "true"}">${av}</div>
    <h1 class="name">${esc(SITE.name)}</h1>
    <p class="tagline">${esc(SITE.tagline)}</p>
    <ul class="meta">${SITE.meta.map(m => `<li>${esc(m)}</li>`).join("")}</ul>
    <div class="links">${SITE.links.map(l => `<a ${ext(l.url)}>${esc(l.label)} ↗</a>`).join("")}</div>`;
  document.getElementById("foot-left").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;
}

function postList(items) {
  return `<ul class="posts">${items.map(p => `
    <li><a class="row" href="#${esc(p.slug)}">
      <span class="date">${fmtDate(p.date)}</span>
      <span><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p>
        <span class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</span></span>
    </a></li>`).join("")}</ul>`;
}

function renderStatic() {
  document.getElementById("view-hakkimda").innerHTML = `
    <p class="eyebrow">Hakkımda</p>
    <h2>Merhaba, ben ${esc(SITE.name.split(" ")[0])}.</h2>
    <div class="prose">${SITE.about}</div>
    <dl class="facts">${SITE.facts.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div class="section-sub">
      <p class="eyebrow">Son yazılar</p>
      ${postList(postsSorted.slice(0, 3))}
      <p><a href="#blog">Tüm yazılar →</a></p>
    </div>`;

  document.getElementById("view-blog").innerHTML = `
    <p class="eyebrow">Blog · ${postsSorted.length} yazı</p>
    <h2>Yazılar</h2>
    ${postList(postsSorted)}`;

  document.getElementById("view-projeler").innerHTML = `
    <p class="eyebrow">Projeler</p>
    <h2>Üzerinde çalıştıklarım</h2>
    <div class="projects">${SITE.projects.map(p => `
      <article class="project">
        <span class="year">${esc(p.year)}</span>
        <div><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p></div>
        <div class="foot"><span class="status">${esc(p.status)}</span>
          ${p.url ? `<a ${ext(p.url)}>Görüntüle ↗</a>` : ""}</div>
      </article>`).join("")}</div>`;

  document.getElementById("view-iletisim").innerHTML = `
    <p class="eyebrow">İletişim</p>
    <h2>Bana ulaş</h2>
    <div class="prose"><p>Bir soru, öneri ya da sadece merhaba demek için yazabilirsin. Genellikle birkaç gün içinde dönüş yapıyorum.</p></div>
    <div class="contact">${SITE.contact.map((c, i) => `
      <div class="item">
        <span class="label">${esc(c.label)}</span>
        <span class="value">${c.url ? `<a ${ext(c.url)}>${esc(c.value)}</a>` : esc(c.value)}</span>
        ${c.copy ? `<button class="copy" id="copy-${i}" data-v="${esc(c.value)}">Kopyala</button>` : "<span></span>"}
      </div>`).join("")}</div>`;
}

function renderPost(p) {
  document.getElementById("view-yazi").innerHTML = `
    <a class="back" href="#blog">← Tüm yazılar</a>
    <header class="post-head">
      <h2>${esc(p.title)}</h2>
      <span class="date">${fmtDate(p.date)} · ${readTime(p.body)} dk okuma</span>
      <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    </header>
    <article class="prose">${p.body}</article>`;
}

function route() {
  const key = decodeURIComponent(location.hash.slice(1)) || "hakkimda";
  const post = SITE.posts.find(p => p.slug === key);
  const view = post ? "yazi" : (["hakkimda","blog","projeler","iletisim"].includes(key) ? key : "hakkimda");
  if (post) { renderPost(post); document.title = `${post.title} · ${SITE.name}`; }
  else document.title = SITE.name;
  document.querySelectorAll("[data-view]").forEach(s => {
    const on = s.dataset.view === view;
    s.hidden = !on;
    if (on) { s.classList.remove("fade"); void s.offsetWidth; s.classList.add("fade"); }
  });
  const activeTab = post ? "blog" : view;
  document.querySelectorAll("nav.tabs a").forEach(a =>
    a.dataset.tab === activeTab ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}

document.addEventListener("click", e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const v = b.dataset.v;
  const done = () => { b.textContent = "Kopyalandı"; setTimeout(() => b.textContent = "Kopyala", 1600); };
  try {
    navigator.clipboard.writeText(v).then(done, () => selectText(b));
  } catch { selectText(b); }
});
function selectText(b) {
  const el = b.parentElement.querySelector(".value");
  const r = document.createRange(); r.selectNodeContents(el);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

renderId(); renderStatic(); route();
addEventListener("hashchange", () => { route(); window.scrollTo({ top: 0 }); });
